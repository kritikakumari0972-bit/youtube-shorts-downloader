{
  "build": {
    "command": "npm run build",
    "functions": "netlify/functions",
    "publish": ".next"
  },
  "functions": {
    "directory": "netlify/functions",
    "node_bundler": "esbuild"
  },
  "redirects": [
    {
      "from": "/api/*",
      "to": "/.netlify/functions/:splat",
      "status": 200
    }
  ]
}
